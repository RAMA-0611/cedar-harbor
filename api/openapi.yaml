  schemas:
    MoneyAmount:
      type: string
      description: Decimal money amount serialized as string to avoid floating-point drift.
      pattern: "^[0-9]+(\\.[0-9]{2})?$"
      examples:
        - "45000.00"

    CurrencyCode:
      type: string
      description: ISO-4217 currency code used by the commerce flow.
      minLength: 3
      maxLength: 3
      examples:
        - "COP"

    OrderStatus:
      type: string
      description: |
        Order state machine values. Allowed transitions only:
        DRAFT → PENDING_PAYMENT | CANCELLED;
        PENDING_PAYMENT → PAID | FAILED | EXPIRED | CANCELLED;
        PAID → FULFILLED.
        Arbitrary transitions (for example FULFILLED → DRAFT, PAID → DRAFT,
        or FAILED → PAID) are outside this contract unless an explicitly
        documented future extension says otherwise.
      enum:
        - DRAFT
        - PENDING_PAYMENT
        - PAID
        - FULFILLED
        - FAILED
        - EXPIRED
        - CANCELLED


    ErrorCode:
      type: string
      description: |
        Functional error codes used by ApiError.code.
        HTTP mapping preference: MALFORMED_REQUEST / INVALID_WEBHOOK_SIGNATURE→400,
        UNAUTHENTICATED→401, FORBIDDEN→403,
        RESOURCE_NOT_FOUND→404; IDEMPOTENCY_CONFLICT / INVALID_ORDER_STATE /
        PRICE_CHANGED / RESOURCE_IN_USE / CUSTOMER_PROFILE_REQUIRED→409; VALIDATION_ERROR / CART_EMPTY / INSUFFICIENT_STOCK /
        RESERVATION_EXPIRED→422; PAYMENT_PROVIDER_ERROR→502 when upstream.
        DUPLICATE_WEBHOOK_EVENT is informational/internal — duplicate webhook
        deliveries still return HTTP 200 acknowledgement and must not drive
        provider retry loops.
      enum:
        - MALFORMED_REQUEST
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - FORBIDDEN
        - RESOURCE_NOT_FOUND
        - RESOURCE_IN_USE
        - CUSTOMER_PROFILE_REQUIRED
        - CART_EMPTY
        - INSUFFICIENT_STOCK
        - RESERVATION_EXPIRED
        - PRICE_CHANGED
        - INVALID_ORDER_STATE
        - IDEMPOTENCY_CONFLICT
        - PAYMENT_PROVIDER_ERROR
        - INVALID_WEBHOOK_SIGNATURE
        - DUPLICATE_WEBHOOK_EVENT
        - INTERNAL_ERROR

    ApiError:
      type: object
      required: [code, message, details]
      additionalProperties: false
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          description: Human-readable error summary.
        details:
          type: object
          description: Structured details (fields, ids, counts). Empty object when there is nothing to add.
          additionalProperties: true
        trace_id:
          type: string
          description: Optional correlation id for support/debugging.
          examples:
            - "trace-synth-0001"

    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
          description: Never echoed in responses.

    AuthenticatedUser:
      type: object
      required: [id, name, email, role, customer_id]
      additionalProperties: false
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [ADMIN, CUSTOMER]
        customer_id:
          type: ["string", "null"]
          format: uuid
          description: Linked Customer profile id when the user is a CUSTOMER with profile; otherwise null.

    AuthResponse:
      type: object
      required: [user]
      additionalProperties: false
      properties:
        user:
          $ref: "#/components/schemas/AuthenticatedUser"

    Category:
      type: object
