# CI/CD de Proyecto Rotor (ByteBlade)
#
#   pull_request -> solo pruebas (no construye ni despliega)
#   push a main  -> pruebas -> construir y publicar imágenes (GHCR) -> desplegar
#   tag v*       -> igual, y las imágenes quedan etiquetadas con la versión (v0.4.0)
#   manual       -> "image_tag": vuelve a desplegar una versión anterior (rollback) sin reconstruir pruebas ni imágenes
#
# Si cualquier prueba falla (backend, frontend, compose o E2E), los trabajos "build" y "deploy" NO se ejecutan.

name: ci-cd

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Rollback: etiqueta de imagen ya publicada a desplegar (ej. v0.4.0 o sha-abc1234)"
        required: true

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # ─────────────────────────── Pruebas ───────────────────────────
  test-backend:
    name: Pruebas backend (PHPUnit)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: rotor_testing
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci_user -d rotor_testing"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: rotor_testing
      DB_USERNAME: ci_user
      DB_PASSWORD: ci_password
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, pdo_pgsql, mbstring, intl, redis
          coverage: none
      - uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Generar APP_KEY efímera para las pruebas
        run: echo "APP_KEY=$(php artisan key:generate --show)" >> "$GITHUB_ENV"
      - run: php artisan test

  test-frontend:
    name: Frontend (tipos, lint y compilación)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      # LayoutProps<> y tipos de rutas App Router se generan aquí (sin build completo).
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: ""

  validate-compose:
    name: Validar Docker (compose y Caddyfile)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compose.yaml (desarrollo) es válido
        run: docker compose -f compose.yaml config --quiet
      - name: compose.prod.yaml exige las variables sensibles
        run: |
          if docker compose -f compose.yaml -f compose.prod.yaml config --quiet 2>/dev/null; then
            echo "::error::compose.prod.yaml debería fallar sin variables obligatorias"; exit 1
          fi
      - name: Caddyfile es válido
        run: |
          docker run --rm -e SITE_ADDRESS=example.com -v "$PWD/docker/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Buscar secretos en el repositorio (historial completo)
        run: |
          git fetch --unshallow 2>/dev/null || true
          # Archivos de entorno o llaves privadas que alguna vez se hayan agregado (se permiten solo los *.example).
          FOUND="$(git log --all --diff-filter=A --name-only --format= \
            | grep -E '(^|/)\.env(\.[A-Za-z0-9_.-]+)?$|\.pem$|\.key$|(^|/)id_(rsa|ed25519)$' \
            | grep -vE '\.example$' | sort -u || true)"
          if [ -n "$FOUND" ]; then echo "::error::Archivos sensibles en el historial:"; echo "$FOUND"; exit 1; fi
          echo "Sin archivos .env/llaves en el historial."

  e2e:
    name: E2E con navegador
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: rotor_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci_user -d rotor_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, pdo_pgsql, mbstring, intl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Preparar backend y entorno E2E (valores efímeros, no secretos)
        working-directory: backend
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          cp .env.e2e.example .env.e2e
          sed -i "s#^APP_KEY=.*#APP_KEY=$(php artisan key:generate --show)#" .env.e2e
          sed -i "s#^DB_USERNAME=.*#DB_USERNAME=ci_user#; s#^DB_PASSWORD=.*#DB_PASSWORD=ci_password#" .env.e2e
          sed -i "s#^E2E_ADMIN_PASSWORD=.*#E2E_ADMIN_PASSWORD=$(openssl rand -hex 8)Aa1#" .env.e2e
          sed -i "s#^E2E_CUSTOMER_PASSWORD=.*#E2E_CUSTOMER_PASSWORD=$(openssl rand -hex 8)Aa1#" .env.e2e
          echo "PAYMENT_PROVIDER=simulated" >> .env.e2e
          echo "E2E env keys (no secrets):"
          grep -E '^(APP_ENV|DB_CONNECTION|DB_DATABASE)=' .env.e2e
          test "$(grep -E '^APP_ENV=' .env.e2e)" = "APP_ENV=e2e"
          test "$(grep -E '^DB_CONNECTION=' .env.e2e)" = "DB_CONNECTION=pgsql"
          test "$(grep -E '^DB_DATABASE=' .env.e2e)" = "DB_DATABASE=rotor_e2e"
      - working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run test:e2e

  # ─────────────────── Construcción y publicación de imágenes ───────────────────
  build:
    name: Construir y publicar imágenes (${{ matrix.service }})
    needs: [test-backend, test-frontend, validate-compose, e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        service: [app, web]
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      repo: ${{ steps.vars.outputs.repo }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: |
          echo "repo=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.vars.outputs.repo }}-${{ matrix.service }}
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ───────────────────────────── Despliegue ─────────────────────────────
  # Se ejecuta tras un "build" exitoso (push a main / tag v*) o manualmente con "image_tag" (rollback).
  #
  # Secretos de GitHub requeridos: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_PATH
  # (y GHCR_PULL_TOKEN si el paquete es privado). Variable opcional: PUBLIC_URL (verificación final).
  # Las credenciales de la APLICACIÓN (APP_KEY, POSTGRES_PASSWORD, ADMIN_PASSWORD…) viven en el
  # archivo .env DEL SERVIDOR; nunca en el repositorio ni en estos secretos.
  deploy:
    name: Desplegar en el servidor
    needs: [build]
    if: ${{ !cancelled() && (needs.build.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - id: vars
        env:
          BUILD_TAG: ${{ needs.build.outputs.tag }}
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          echo "repo=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "tag=${INPUT_TAG:-$BUILD_TAG}" >> "$GITHUB_OUTPUT"
      - name: Preparar llave SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Copiar archivos de operación
        env:
          T: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          P: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/id_deploy "$T" "mkdir -p '$P/docker'"
          scp -i ~/.ssh/id_deploy compose.yaml compose.prod.yaml "$T:$P/"
          scp -i ~/.ssh/id_deploy docker/Caddyfile "$T:$P/docker/"
      - name: Actualizar contenedores (falla si algún servicio no queda healthy)
        env:
          T: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          P: ${{ secrets.DEPLOY_PATH }}
          REPO: ${{ steps.vars.outputs.repo }}
          TAG: ${{ steps.vars.outputs.tag }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          ssh -i ~/.ssh/id_deploy "$T" "P='$P' REPO='$REPO' TAG='$TAG' GHCR_TOKEN='$GHCR_TOKEN' GHCR_USER='$GHCR_USER' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$P"
          test -f .env || { echo "Falta .env en el servidor (copie .env.example y complete los valores)"; exit 1; }
          printf 'APP_IMAGE=ghcr.io/%s-app:%s\nWEB_IMAGE=ghcr.io/%s-web:%s\n' "$REPO" "$TAG" "$REPO" "$TAG" > .deploy.env
          if [ -n "$GHCR_TOKEN" ]; then echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin; fi
          DC="docker compose --env-file .env --env-file .deploy.env -f compose.yaml -f compose.prod.yaml"
          $DC pull app web
          $DC up -d --remove-orphans
          for i in $(seq 1 30); do
            if [ -z "$($DC ps --format '{{.Health}}' | grep -v healthy || true)" ]; then echo "Todos los servicios healthy"; $DC ps; exit 0; fi
            sleep 5
          done
          $DC ps; echo "Algún servicio no quedó healthy"; exit 1
          REMOTE
      - name: Verificar la URL pública
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          if [ -n "$PUBLIC_URL" ]; then curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "$PUBLIC_URL/up" -o /dev/null && echo "OK $PUBLIC_URL"; fi
