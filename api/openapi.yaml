          format: uuid
        category_id:
          type: string
          format: uuid
        sku:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 255
        description:
          type: ["string", "null"]
        brand:
          type: ["string", "null"]
          maxLength: 120
        condition:
          type: ["string", "null"]
          maxLength: 40
        unit:
          type: ["string", "null"]
          maxLength: 60
        price:
          $ref: "#/components/schemas/MoneyAmount"
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        tax_rate:
          type: string
          pattern: "^[0-9]+(\\.[0-9]{1,4})?$"
        stock_quantity:
          type: integer
          minimum: 0
        is_active:
          type: boolean
        created_at:
          type: ["string", "null"]
          format: date-time
        updated_at:
          type: ["string", "null"]
          format: date-time

    AdminProductWriteRequest:
      type: object
      additionalProperties: false
      properties:
        category_id:
          type: string
          format: uuid
        sku:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 255
        description:
          type: ["string", "null"]
        brand:
          type: ["string", "null"]
          maxLength: 120
        condition:
          type: ["string", "null"]
          maxLength: 40
        unit:
          type: ["string", "null"]
          maxLength: 60
        price:
          type: number
          minimum: 0
        currency:
          type: string
          enum: [COP]
        tax_rate:
          type: number
          minimum: 0
          maximum: 1
        stock_quantity:
          type: integer
          minimum: 0
        is_active:
          type: boolean

    AdminProductEnvelope:
      type: object
      required: [data]
