openapi: 3.1.0
info:
  title: Project Rotor API
  version: 0.1.0
  summary: Public REST contract for Project Rotor transactional commerce.
  description: |
    Public API contract for the transactional commerce flow of Project Rotor.

    Conceptual flow:

    Inventario → Catálogo → Carrito → Checkout → Orden → Pasarela sandbox →
    Webhook → Confirmación → Conciliación

    Conceptual stack:
    - Frontend: Next.js / React / TypeScript
    - Backend API: Laravel (PHP)
    - Persistence: defined by the data model; this contract is
      persistence-agnostic and does not depend on a specific database engine
    - Authentication: Laravel Sanctum (cookie-based session)
    - Payments: sandbox providers only

    Identifier strategy:
    Resource identifiers (`id`, `product_id`, `cartItemId`, `orderId`, etc.)
    use UUID (`format: uuid`) consistently across this contract.

    Inventory and reservation rules (business contract, not implementation):
    - `available_quantity = quantity - reserved_quantity`
    - Adding or updating cart lines must not exceed available stock
    - Checkout must re-validate availability and active reservations
    - Order creation requires a still-valid reservation and keeps it active
    - Transition to PAID applies the definitive inventory effect exactly once
    - FAILED, EXPIRED, or CANCELLED releases the reservation when applicable

    Order state machine (allowed transitions only):
    - DRAFT → PENDING_PAYMENT
    - DRAFT → CANCELLED
    - PENDING_PAYMENT → PAID
    - PENDING_PAYMENT → FAILED
    - PENDING_PAYMENT → EXPIRED
    - PENDING_PAYMENT → CANCELLED
    - PAID → FULFILLED

    Arbitrary transitions are not allowed. In particular, transitions such as
    FULFILLED → DRAFT, PAID → DRAFT, or FAILED → PAID are not part of this
    contract unless an explicitly documented future extension says otherwise.

    Authentication and CSRF (conceptual):
    Project Rotor contemplates cookie/session authentication compatible with
    Laravel Sanctum. CORS does not replace authentication. Mutable
    authenticated operations must consider CSRF protection according to the
    definitive mechanism chosen by the implementation. The cookie name
    `rotor_session` is conceptual and may change. This contract does not
    invent private cookies or endpoints from any existing system.

    CORS (HTTP configuration, not authentication or authorization):
    CORS is backend HTTP configuration only. When frontend and API run on
    different origins and cookies are used: the frontend origin must be
    authorized explicitly; credentialed requests must be supported when
    applicable; required methods and headers must be allowed; and
    `Access-Control-Allow-Origin: *` must not be recommended with credentials.
    CORS is neither authentication nor authorization.

    Payment confirmation:
    Browser return/redirect from the payment gateway is NOT an authoritative
    payment confirmation and must never drive the definitive transition to
    PAID by itself. Transition to PAID depends on a signature-validated
    webhook or an explicit reconciliation against the provider—never on
    browser query parameters alone.

    Error shape:
    Every error response uses the common `ApiError` schema with `code`,
    `message`, and `details` (an empty object when there is nothing to add),
    plus an optional `trace_id` for correlation.

    Functional HTTP mapping (conceptual preference):
    - 400 → MALFORMED_REQUEST (unparseable JSON, wrong parameter types such
      as a non-UUID path id, missing required headers) and
      INVALID_WEBHOOK_SIGNATURE
    - 401 → UNAUTHENTICATED
    - 403 → FORBIDDEN
    - 404 → RESOURCE_NOT_FOUND
    - 409 → IDEMPOTENCY_CONFLICT, INVALID_ORDER_STATE, PRICE_CHANGED,
      RESOURCE_IN_USE, CUSTOMER_PROFILE_REQUIRED, and other current-resource state conflicts
    - 422 → VALIDATION_ERROR, CART_EMPTY, INSUFFICIENT_STOCK,
      RESERVATION_EXPIRED
    - 502 → PAYMENT_PROVIDER_ERROR for applicable upstream provider failures

    Webhook duplicate handling:
    If `X-Webhook-Id` / `event_id` was already processed, the API must return
    HTTP 200 with an idempotent acknowledgement, without re-running business
    effects (no second inventory deduction, no repeated state transition).
    `DUPLICATE_WEBHOOK_EVENT` may be retained as an internal/informational
    code, but a legitimate provider retry must not receive an error status
    that encourages infinite retries.
  contact:
    name: Project Rotor team
    url: https://github.com/RAMA-0611/cedar-harbor
  license:
    name: All Rights Reserved
    url: https://github.com/RAMA-0611/cedar-harbor/blob/main/LICENSE

servers:
  - url: http://localhost:8000
    description: Local development

tags:
  - name: Auth
    description: |
      Authentication endpoints for the stateful Laravel Sanctum session used by
      the E3 SPA/backend. Clients should call `GET /sanctum/csrf-cookie` first
      (framework endpoint, not listed under `/api`), then mutate with cookies
      and CSRF as required by Sanctum.
  - name: Catalog
    description: Public product catalog endpoints.
  - name: Admin Categories
    description: Administrative CRUD for catalog categories (ADMIN role).
  - name: Admin Products
    description: Administrative CRUD for catalog products (ADMIN role).
  - name: Admin Customers
    description: Administrative CRUD for customers (ADMIN role).
  - name: Admin Users
    description: Administrative CRUD for users (ADMIN role).
  - name: Cart
    description: Authenticated shopping cart and temporary stock reservations.
  - name: Checkout
    description: Pre-order validation of cart, stock, prices, and buyer data.
  - name: Orders
    description: |
      Order creation through PENDING_PAYMENT, consultation, status, and
      cancellation. Sandbox payment confirmation is out of scope for E3
      (see issue #9).

paths:
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Authenticate with email and password
      description: |
        Starts a stateful Sanctum session (`web` guard). SPA clients obtain a
        CSRF cookie via `GET /sanctum/csrf-cookie` before this call and send
        credentials with cookies enabled.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              customer:
                value:
                  email: "customer.demo@example.test"
                  password: "password"
      responses:
        "200":
          description: Authenticated session established.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
              examples:
                customer:
                  value:
                    user:
                      id: 2
                      name: "Cliente Demo"
                      email: "customer.demo@example.test"
                      role: CUSTOMER
                      customer_id: "dddddddd-dddd-4ddd-8ddd-dddddddddddd"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: End the current session
      description: Logs out the authenticated user and invalidates the session.
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Session ended. No response body.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/auth/me:
    get:
      tags: [Auth]
      operationId: me
      summary: Current authenticated user
      description: Returns the session user payload (no password fields).
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/products:
    get:
      tags: [Catalog]
      operationId: listProducts
      summary: List catalog products
      description: |
        Returns a paginated list of publicly visible products.
        Minimal contract so cart and checkout can reference products.
      security: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number (1-based).
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Items per page.
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
          description: Optional free-text search over name/SKU.
      responses:
        "200":
          description: Product list retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
              examples:
                sample:
                  summary: Synthetic catalog page
                  value:
                    data:
                      - id: "11111111-1111-4111-8111-111111111111"
                        sku: "ROTOR-BRG-6205"
                        name: "Rodamiento industrial"
                        unit_price: "45000.00"
                        currency: "COP"
                        available_quantity: 24
                        tax_rate: "0.1900"
                      - id: "22222222-2222-4222-8222-222222222222"
                        sku: "ROTOR-CBL-3X10"
                        name: "Cable de potencia"
                        unit_price: "18900.00"
                        currency: "COP"
                        available_quantity: 150
                        tax_rate: "0.1900"
                      - id: "33333333-3333-4333-8333-333333333333"
                        sku: "ROTOR-CTR-40A"
                        name: "Contactor trifásico"
                        unit_price: "128500.00"
                        currency: "COP"
                        available_quantity: 8
                        tax_rate: "0.1900"
                    meta:
                      page: 1
                      per_page: 20
                      total: 3
        "400":
          description: Malformed query parameters (for example `page=abc`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                badPage:
                  value:
                    code: MALFORMED_REQUEST
                    message: Query parameter page must be an integer.
                    details:
                      parameter: page
                    trace_id: "trace-synth-0400a"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/products/{productId}:
    get:
      tags: [Catalog]
      operationId: getProduct
      summary: Get product by id
      description: Returns a single product summary for catalog and cart reference.
      security: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Product found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductSummary"
              examples:
                bearing:
                  summary: Synthetic product
                  value:
                    id: "11111111-1111-4111-8111-111111111111"
                    sku: "ROTOR-BRG-6205"
                    name: "Rodamiento industrial"
                    unit_price: "45000.00"
                    currency: "COP"
                    available_quantity: 24
                    tax_rate: "0.1900"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/admin/categories:
    get:
      tags: [Admin Categories]
      operationId: adminListCategories
      summary: List categories
      description: Returns all categories ordered by name. Requires ADMIN.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Category list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryListResponse"
              examples:
                sample:
                  value:
                    data:
                      - id: "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
                        name: "Rodamientos"
                        slug: "rodamientos"
                        description: "Categoría sintética"
                        is_active: true
                        created_at: "2026-10-15T12:00:00Z"
                        updated_at: "2026-10-15T12:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Admin Categories]
      operationId: adminCreateCategory
      summary: Create category
      description: Creates a category. Requires ADMIN.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryWriteRequest"
            examples:
              create:
                value:
                  name: "Rodamientos"
                  slug: "rodamientos"
                  description: "Categoría sintética"
                  is_active: true
      responses:
        "201":
          description: Category created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/admin/categories/{categoryId}:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Admin Categories]
      operationId: adminGetCategory
      summary: Get category
      description: Returns one category. Requires ADMIN.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Category found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Admin Categories]
      operationId: adminUpdateCategory
      summary: Update category
      description: Partially updates a category. Requires ADMIN.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryWriteRequest"
            examples:
              rename:
                value:
                  name: "Rodamientos industriales"
      responses:
        "200":
          description: Category updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Admin Categories]
      operationId: adminDeleteCategory
      summary: Delete category
      description: |
        Deletes a category when it has no products.
        Returns RESOURCE_IN_USE when products still reference it.
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Category deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/admin/products:
    get:
      tags: [Admin Products]
      operationId: adminListProducts
      summary: List products
      description: Returns all products ordered by name. Requires ADMIN.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Product list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductListResponse"
              examples:
                sample:
                  value:
                    data:
                      - id: "11111111-1111-4111-8111-111111111111"
                        category_id: "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
                        sku: "ROTOR-BRG-6205"
                        name: "Rodamiento industrial"
                        description: "Producto sintético"
                        brand: "Línea Rotor"
                        condition: "Nuevo"
                        unit: "unidad"
                        price: "45000.00"
                        currency: "COP"
                        tax_rate: "0.1900"
                        stock_quantity: 24
                        is_active: true
                        created_at: "2026-10-15T12:00:00Z"
                        updated_at: "2026-10-15T12:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Admin Products]
      operationId: adminCreateProduct
      summary: Create product
      description: Creates a product. Requires ADMIN. Server is price/tax authority.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminProductWriteRequest"
            examples:
              create:
                value:
                  category_id: "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
                  sku: "ROTOR-BRG-6205"
                  name: "Rodamiento industrial"
                  description: "Producto sintético"
                  brand: "Línea Rotor"
                  condition: "Nuevo"
                  unit: "unidad"
                  price: 45000.00
                  currency: "COP"
                  tax_rate: 0.1900
                  stock_quantity: 24
                  is_active: true
      responses:
        "201":
          description: Product created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/admin/products/{productId}:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    get:
      tags: [Admin Products]
      operationId: adminGetProduct
      summary: Get product
      description: Returns one admin product. Requires ADMIN.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Product found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Admin Products]
      operationId: adminUpdateProduct
      summary: Update product
      description: Partially updates a product. Requires ADMIN.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminProductWriteRequest"
            examples:
              stock:
                value:
                  stock_quantity: 30
      responses:
        "200":
          description: Product updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Admin Products]
      operationId: adminDeleteProduct
      summary: Delete product
      description: |
        Deletes a product when it is not referenced by cart items,
        stock reservations, or order items. Otherwise RESOURCE_IN_USE.
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Product deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/admin/customers:
    get:
      tags: [Admin Customers]
      operationId: adminListCustomers
      summary: List customers
      description: Returns customers ordered by created_at descending. Requires ADMIN.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Customer list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerListResponse"
              examples:
                sample:
                  value:
                    data:
                      - id: "bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb"
                        user_id: 2
                        name: "Cliente Sintetico"
                        email: "cliente.sintetico@example.test"
                        phone: "+57-300-000-0000"
                        document_type: "CC"
                        document_number: "1000000000"
                        created_at: "2026-10-15T12:00:00Z"
                        updated_at: "2026-10-15T12:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Admin Customers]
      operationId: adminCreateCustomer
      summary: Create customer
      description: Creates a customer. Requires ADMIN.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerWriteRequest"
            examples:
              create:
                value:
                  name: "Cliente Sintetico"
                  email: "cliente.sintetico@example.test"
                  phone: "+57-300-000-0000"
                  document_type: "CC"
                  document_number: "1000000000"
      responses:
        "201":
          description: Customer created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/admin/customers/{customerId}:
    parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Admin Customers]
      operationId: adminGetCustomer
      summary: Get customer
      description: Returns one customer. Requires ADMIN.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Customer found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Admin Customers]
      operationId: adminUpdateCustomer
      summary: Update customer
      description: Partially updates a customer. Requires ADMIN.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerWriteRequest"
            examples:
              phone:
                value:
                  phone: "+57-300-111-9999"
      responses:
        "200":
          description: Customer updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Admin Customers]
      operationId: adminDeleteCustomer
      summary: Delete customer
      description: |
        Deletes a customer. Linked carts/orders keep their snapshots and set
        customer_id to null. Does not delete the linked User.
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Customer deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/admin/users:
    get:
      tags: [Admin Users]
      operationId: adminListUsers
      summary: List users
      description: Returns users ordered by created_at descending. Requires ADMIN.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: User list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
              examples:
                sample:
                  value:
                    data:
                      - id: 1
                        name: "Admin Sintetico"
                        email: "admin@example.test"
                        role: "ADMIN"
                        created_at: "2026-10-15T12:00:00Z"
                        updated_at: "2026-10-15T12:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Admin Users]
      operationId: adminCreateUser
      summary: Create user
      description: Creates a user. Password is write-only. Requires ADMIN.
      security:
        - cookieAuth: []
      requestBody:
