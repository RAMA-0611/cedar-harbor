<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1380" viewBox="0 0 1660 1380" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Wireframe — Carrito y checkout · Project Rotor</title>
  <desc id="desc">Esquema del flujo de carrito y checkout: indicador de pasos, carrito, datos del comprador, modalidad de entrega, resumen del pedido, confirmación y anotaciones.</desc>
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; fill: #222; }
    .ttl { font-size: 20px; font-weight: 700; }
    .h1 { font-size: 26px; font-weight: 700; }
    .h2 { font-size: 18px; font-weight: 700; }
    .t { font-size: 14px; }
    .b { font-size: 15px; font-weight: 700; }
    .s { font-size: 12px; fill: #555; }
    .w { fill: #fff; }
    .frame { fill: #fff; stroke: #333; stroke-width: 2; }
    .band { fill: #e9e9e9; stroke: #bbb; }
    .panel { fill: #fff; stroke: #888; stroke-width: 1.5; }
    .line { fill: #fafafa; stroke: #aaa; }
    .field { fill: #fff; stroke: #777; }
    .btn1 { fill: #333; }
    .btn2 { fill: #fff; stroke: #333; stroke-width: 1.5; }
    .rule { stroke: #bbb; }
    .dash { fill: none; stroke: #777; stroke-dasharray: 6 4; }
    .step { fill: #fff; stroke: #333; stroke-width: 1.5; }
    .mk { fill: #1f6feb; }
    .mkt { font-size: 13px; font-weight: 700; fill: #fff; }
    .nt { font-size: 13px; fill: #222; }
  </style>
  <defs>
    <g id="mk"><circle r="13" class="mk"/></g>
  </defs>

  <text x="20" y="36" class="ttl">Wireframe — Carrito y checkout · Project Rotor · Entrega 2 (escritorio, 1280 px)</text>

  <rect x="20" y="60" width="1240" height="1290" class="frame"/>

  <!-- Encabezado -->
  <rect x="20" y="60" width="1240" height="64" class="band"/>
  <rect x="44" y="76" width="32" height="32" rx="6" class="btn1"/>
  <text x="60" y="98" class="b w" text-anchor="middle">R</text>
  <text x="88" y="98" class="b">Proyecto Rotor</text>
  <text x="1010" y="98" class="t">Catálogo</text>
  <rect x="1100" y="78" width="130" height="30" rx="15" class="btn2"/>
  <text x="1165" y="98" class="t" text-anchor="middle" text-decoration="underline">Carrito (2)</text>

  <text x="50" y="170" class="h1">Carrito y checkout</text>

  <!-- Indicador de pasos -->
  <circle cx="64" cy="208" r="14" class="step"/>
  <text x="64" y="213" class="t" text-anchor="middle">✓</text>
  <text x="86" y="213" class="t">Carrito</text>
  <line x1="150" y1="208" x2="200" y2="208" class="rule"/>
  <circle cx="224" cy="208" r="14" class="btn1"/>
  <text x="224" y="213" class="b w" text-anchor="middle">2</text>
  <text x="246" y="213" class="b">Datos</text>
  <line x1="300" y1="208" x2="350" y2="208" class="rule"/>
  <circle cx="374" cy="208" r="14" class="step"/>
  <text x="374" y="213" class="t" text-anchor="middle">3</text>
  <text x="396" y="213" class="t">Confirmación</text>

  <rect x="50" y="240" width="1180" height="34" class="dash"/>
  <text x="66" y="262" class="s">Zona de estado: cargando · carrito vacío + “Ir al catálogo” · error + “Reintentar”</text>

  <!-- Paso 1: carrito -->
  <rect x="50" y="290" width="780" height="330" class="panel"/>
  <text x="70" y="322" class="h2">1. Revisa tu carrito</text>

  <rect x="70" y="338" width="740" height="96" class="line"/>
  <text x="90" y="366" class="b">Nombre del producto</text>
  <text x="90" y="388" class="s">SKU: XX-XXX-0000 · $ 000.000 + IVA por unidad</text>
  <text x="90" y="418" class="s">Cantidad</text>
  <rect x="146" y="400" width="70" height="28" class="field"/>
  <text x="181" y="419" class="t" text-anchor="middle">2</text>
  <text x="236" y="419" class="t" text-decoration="underline">Quitar</text>
  <text x="790" y="366" class="b" text-anchor="end">$ 000.000</text>

  <rect x="70" y="444" width="740" height="96" class="line"/>
  <text x="90" y="472" class="b">Nombre del producto</text>
  <text x="90" y="494" class="s">SKU: XX-XXX-0000 · $ 000.000 + IVA por unidad</text>
  <text x="90" y="524" class="s">Cantidad</text>
  <rect x="146" y="506" width="70" height="28" class="field"/>
  <text x="181" y="525" class="t" text-anchor="middle">1</text>
  <text x="236" y="525" class="t" text-decoration="underline">Quitar</text>
  <text x="790" y="472" class="b" text-anchor="end">$ 000.000</text>

  <rect x="70" y="560" width="200" height="40" rx="6" class="btn2"/>
  <text x="170" y="585" class="t" text-anchor="middle">Seguir comprando</text>
  <rect x="590" y="560" width="220" height="40" rx="6" class="btn1"/>
  <text x="700" y="585" class="t w" text-anchor="middle">Continuar con mis datos</text>

  <!-- Paso 2: datos del comprador -->
  <rect x="50" y="640" width="780" height="560" class="panel"/>
  <text x="70" y="672" class="h2">2. Datos del comprador</text>
  <rect x="70" y="688" width="740" height="36" class="dash"/>
  <text x="86" y="711" class="s">Resumen de errores (role="alert") con enlace a cada campo inválido</text>

  <text x="70" y="752" class="t">Nombre completo</text>
  <rect x="70" y="760" width="740" height="34" class="field"/>

  <text x="70" y="818" class="t">Tipo de documento</text>
  <rect x="70" y="826" width="360" height="34" class="field"/>
  <text x="80" y="848" class="s">CC · CE · NIT · PAS</text>
  <text x="414" y="848" class="s">▾</text>
  <text x="450" y="818" class="t">Número de documento</text>
  <rect x="450" y="826" width="360" height="34" class="field"/>
  <text x="450" y="878" class="s">Solo números, entre 5 y 12 dígitos</text>

  <text x="70" y="906" class="t">Correo electrónico</text>
  <rect x="70" y="914" width="360" height="34" class="field"/>
  <text x="450" y="906" class="t">Teléfono</text>
  <rect x="450" y="914" width="360" height="34" class="field"/>

  <rect x="70" y="964" width="740" height="72" class="panel"/>
  <text x="86" y="988" class="b">Modalidad de entrega</text>
  <circle cx="96" cy="1014" r="8" class="field"/>
  <circle cx="96" cy="1014" r="4" class="btn1"/>
  <text x="112" y="1019" class="t">Retiro en sede — sin costo</text>
  <circle cx="440" cy="1014" r="8" class="field"/>
  <text x="456" y="1019" class="t">Envío coordinado — un asesor confirma</text>

  <rect x="70" y="1046" width="740" height="50" class="dash"/>
  <text x="86" y="1068" class="t">Dirección de entrega (solo con envío coordinado)</text>
  <text x="86" y="1086" class="s">Obligatoria con envío coordinado; no aplica con retiro en sede.</text>

  <rect x="70" y="1106" width="740" height="30" class="band"/>
  <text x="86" y="1126" class="s"><tspan font-weight="700">Pago sandbox — demostración.</tspan> No se procesan pagos reales.</text>

  <rect x="70" y="1146" width="200" height="40" rx="6" class="btn2"/>
  <text x="170" y="1171" class="t" text-anchor="middle">Volver al carrito</text>
  <rect x="590" y="1146" width="220" height="40" rx="6" class="btn1"/>
  <text x="700" y="1171" class="t w" text-anchor="middle">Continuar al pago</text>

  <!-- Paso 3: confirmación -->
  <rect x="50" y="1216" width="780" height="56" class="panel"/>
  <text x="70" y="1250" class="h2">3. Confirmación</text>
  <text x="810" y="1250" class="s" text-anchor="end">“Pago en verificación” hasta que la API informe el estado</text>

  <!-- Resumen -->
  <rect x="860" y="290" width="370" height="290" class="panel"/>
  <text x="880" y="322" class="h2">Resumen del pedido</text>
  <text x="880" y="356" class="t">2 × Nombre del producto</text>
  <text x="1210" y="356" class="t" text-anchor="end">$ 000.000</text>
  <text x="880" y="384" class="t">1 × Nombre del producto</text>
  <text x="1210" y="384" class="t" text-anchor="end">$ 000.000</text>
  <line x1="880" y1="404" x2="1210" y2="404" class="rule"/>
  <text x="880" y="432" class="t">Subtotal</text>
  <text x="1210" y="432" class="t" text-anchor="end">$ 000.000</text>
  <text x="880" y="460" class="t">IVA (19 %)</text>
  <text x="1210" y="460" class="t" text-anchor="end">$ 000.000</text>
  <line x1="880" y1="476" x2="1210" y2="476" class="rule"/>
  <text x="880" y="508" class="h2">Total</text>
  <text x="1210" y="508" class="h2" text-anchor="end">$ 000.000</text>
  <text x="880" y="540" class="s">Totales calculados por la API</text>
  <text x="880" y="558" class="s">(subtotal · tax_total · total)</text>

  <!-- Pie -->
  <rect x="20" y="1288" width="1240" height="62" class="band"/>
  <text x="44" y="1314" class="s">Proyecto Rotor · Prototipo académico — todos los productos, precios y existencias son sintéticos</text>
  <text x="44" y="1334" class="s">Catálogo · Carrito  |  Estados de demostración: carga · sin resultados · error</text>

  <!-- Marcadores -->
  <use href="#mk" x="530" y="208"/><text x="530" y="213" class="mkt" text-anchor="middle">1</text>
  <use href="#mk" x="816" y="294"/><text x="816" y="299" class="mkt" text-anchor="middle">2</text>
  <use href="#mk" x="816" y="644"/><text x="816" y="649" class="mkt" text-anchor="middle">3</text>
  <use href="#mk" x="796" y="968"/><text x="796" y="973" class="mkt" text-anchor="middle">4</text>
  <use href="#mk" x="796" y="1050"/><text x="796" y="1055" class="mkt" text-anchor="middle">5</text>
  <use href="#mk" x="824" y="1166"/><text x="824" y="1171" class="mkt" text-anchor="middle">6</text>
  <use href="#mk" x="1216" y="294"/><text x="1216" y="299" class="mkt" text-anchor="middle">7</text>
  <use href="#mk" x="816" y="1220"/><text x="816" y="1225" class="mkt" text-anchor="middle">8</text>

  <!-- Anotaciones -->
  <text x="1290" y="92" class="h2">Anotaciones</text>

  <use href="#mk" x="1304" y="128"/><text x="1304" y="133" class="mkt" text-anchor="middle">1</text>
  <text x="1326" y="126" class="nt">Pasos: solo uno visible a la vez; aquí</text>
  <text x="1326" y="144" class="nt">se apilan para documentar las tres</text>
  <text x="1326" y="162" class="nt">zonas del flujo.</text>

  <use href="#mk" x="1304" y="206"/><text x="1304" y="211" class="mkt" text-anchor="middle">2</text>
  <text x="1326" y="204" class="nt">Carrito: GET /api/cart. Cambiar</text>
  <text x="1326" y="222" class="nt">cantidad → PATCH /api/cart/items/{id};</text>
  <text x="1326" y="240" class="nt">quitar → DELETE.</text>

  <use href="#mk" x="1304" y="284"/><text x="1304" y="289" class="mkt" text-anchor="middle">3</text>
  <text x="1326" y="282" class="nt">Comprador → CustomerData (name,</text>
  <text x="1326" y="300" class="nt">document_type, document_number,</text>
  <text x="1326" y="318" class="nt">email, phone).</text>

  <use href="#mk" x="1304" y="362"/><text x="1304" y="367" class="mkt" text-anchor="middle">4</text>
  <text x="1326" y="360" class="nt">Modalidad → DeliveryData.mode:</text>
  <text x="1326" y="378" class="nt">PICKUP / COORDINATED_SHIPPING.</text>

  <use href="#mk" x="1304" y="422"/><text x="1304" y="427" class="mkt" text-anchor="middle">5</text>
  <text x="1326" y="420" class="nt">Dirección → DeliveryData.address →</text>
  <text x="1326" y="438" class="nt">orders.delivery_address (snapshot).</text>
  <text x="1326" y="456" class="nt">Obligatoria con COORDINATED_SHIPPING;</text>
  <text x="1326" y="474" class="nt">NULL con PICKUP.</text>

  <use href="#mk" x="1304" y="500"/><text x="1304" y="505" class="mkt" text-anchor="middle">6</text>
  <text x="1326" y="498" class="nt">“Continuar al pago” →</text>
  <text x="1326" y="516" class="nt">POST /api/checkout/validate →</text>
  <text x="1326" y="534" class="nt">POST /api/orders (Idempotency-Key) →</text>
  <text x="1326" y="552" class="nt">POST /api/orders/{id}/payment-intent.</text>

  <use href="#mk" x="1304" y="596"/><text x="1304" y="601" class="mkt" text-anchor="middle">7</text>
  <text x="1326" y="594" class="nt">Resumen: muestra los totales que</text>
  <text x="1326" y="612" class="nt">devuelve la API.</text>

  <use href="#mk" x="1304" y="656"/><text x="1304" y="661" class="mkt" text-anchor="middle">8</text>
  <text x="1326" y="654" class="nt">Confirmación: el redirect no confirma</text>
  <text x="1326" y="672" class="nt">el pago; el estado se consulta en</text>
  <text x="1326" y="690" class="nt">GET /api/orders/{id}/status.</text>

  <rect x="1290" y="730" width="340" height="50" class="dash"/>
  <text x="1304" y="760" class="s">Línea discontinua = zona condicional o prevista.</text>
</svg>
