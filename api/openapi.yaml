        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/orders/{orderId}/status:
    get:
      tags: [Orders]
      operationId: getOrderStatus
      summary: Get order status
      description: Lightweight status probe for the order state machine.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Current status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderStatusResponse"
              examples:
                pending:
                  value:
                    order_id: "cccccccc-cccc-4ccc-8ccc-cccccccccccc"
                    status: PENDING_PAYMENT
                    updated_at: "2026-09-18T15:05:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/orders/{orderId}/cancel:
    post:
      tags: [Orders]
      operationId: cancelOrder
      summary: Cancel order when allowed
      description: |
        Cancels an order only when the state machine permits it
        (DRAFT or PENDING_PAYMENT → CANCELLED). Invalid transitions return
        `INVALID_ORDER_STATE` (HTTP 409). Successful cancellation sets
        `cancelled_at` and releases linked stock reservations
        (`ACTIVE` → `RELEASED` with `released_at`). Product `stock_quantity`
        is not modified. Orders belonging to another customer return 404.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Order cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
              examples:
                cancelled:
                  $ref: "#/components/examples/OrderCancelled"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Cancellation not allowed in current state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                invalidState:
                  value:
                    code: INVALID_ORDER_STATE
                    message: Order cannot be cancelled from PAID.
                    details:
                      current_status: PAID
                    trace_id: "trace-synth-0003"
        "500":
          $ref: "#/components/responses/InternalError"


components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: rotor_session
      description: |
        Conceptual cookie/session authentication compatible with Laravel
        Sanctum. CORS does not replace authentication. Mutable authenticated
        operations must consider CSRF protection according to the definitive
        mechanism used by the implementation. The cookie name `rotor_session`
        is conceptual and may change. This contract does not invent private
        cookies or endpoints from any existing system. No bearer tokens are
        defined here.

  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Product UUID.
    CartItemId:
      name: cartItemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Cart line UUID.
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Order UUID.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: |
        Mandatory client-generated key to prevent duplicate order creation
        on retries. Same key + same payload → original result;
        same key + different payload → IDEMPOTENCY_CONFLICT.

  responses:
    BadRequest:
      description: |
        Malformed request: unparseable JSON, wrong parameter types (for
        example a non-UUID path id), or a missing required header.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            malformed:
              value:
                code: MALFORMED_REQUEST
                message: Request could not be parsed.
                details:
                  reason: "productId must be a UUID."
                trace_id: "trace-synth-0400"
    Unauthenticated:
      description: Missing or invalid session.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            unauthenticated:
              value:
                code: UNAUTHENTICATED
                message: Authentication required.
                details: {}
                trace_id: "trace-synth-0401"
    Forbidden:
      description: Authenticated but not allowed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            forbidden:
              value:
                code: FORBIDDEN
                message: You are not allowed to access this resource.
                details: {}
                trace_id: "trace-synth-0403"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            notFound:
              value:
                code: RESOURCE_NOT_FOUND
                message: Resource not found.
                details: {}
                trace_id: "trace-synth-0404"
    Conflict:
      description: |
        Resource state conflict. Includes domain delete conflicts such as
        RESOURCE_IN_USE when a resource is still referenced by domain data.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            resourceInUse:
              value:
                code: RESOURCE_IN_USE
                message: Resource cannot be deleted because it is referenced by domain data.
                details:
                  resource: product
                trace_id: "trace-synth-0409"
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            validation:
              value:
                code: VALIDATION_ERROR
                message: Request validation failed.
                details:
                  fields:
                    quantity: ["must be at least 1"]
                trace_id: "trace-synth-0422"
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            internal:
              value:
                code: INTERNAL_ERROR
                message: Unexpected server error.
                details: {}
                trace_id: "trace-synth-0500"

