        name:
          type: string
          maxLength: 160
        slug:
          type: string
          maxLength: 180
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        description:
          type: ["string", "null"]
        is_active:
          type: boolean

    CategoryEnvelope:
      type: object
