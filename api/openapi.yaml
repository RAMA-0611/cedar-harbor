  /api/checkout/validate:
    post:
      tags: [Checkout]
      operationId: validateCheckout
      summary: Validate checkout prerequisites
      description: |
        Soft preflight for checkout before order creation.

        Business outcomes are always returned as HTTP 200 with
        `valid: true|false` and optional `validation_errors`
        (`CART_EMPTY`, `RESERVATION_EXPIRED`, `INSUFFICIENT_STOCK`).

        HTTP 422 is reserved for malformed/invalid request fields
        (`VALIDATION_ERROR`) on `CheckoutRequest` (customer/delivery).

        E3 MVP pricing policy: cart and checkout use the current server
        catalog price (`Product.price`). There is no client-supplied expected
        price and cart lines do not store a price snapshot, so this endpoint
        does **not** emit `PRICE_CHANGED`. The `PRICE_CHANGED` ErrorCode remains
        reserved for a future negotiated/snapshot price flow.

        Checks performed when a CUSTOMER profile and ACTIVE cart exist:
        - cart is not empty;
        - each line has a matching ACTIVE non-expired reservation;
        - ACTIVE reservation totals do not exceed product stock;
        - delivery mode (PICKUP or COORDINATED_SHIPPING) and, for
          COORDINATED_SHIPPING, a non-blank delivery address (request validation).

        Does not create an empty ACTIVE cart when none exists.
        Does not extend reservation expiry.
        Does not model carriers or complex logistics.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
            examples:
              pickup:
                value:
                  customer:
                    name: "Cliente Demo Rotor"
                    email: "cliente.demo@example.test"
                    phone: "+570000000000"
                    document_type: "CC"
                    document_number: "1000000000"
                  delivery:
                    mode: PICKUP
              coordinatedShipping:
                value:
                  customer:
                    name: "Cliente Demo Rotor"
                    email: "cliente.demo@example.test"
                    phone: "+570000000000"
                    document_type: "CC"
                    document_number: "1000000000"
                  delivery:
                    mode: COORDINATED_SHIPPING
                    address: "Calle Demo 12 # 34-56, Ciudad Rotor"
      responses:
        "200":
          description: Validation result (may be valid or invalid with errors).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutValidation"
              examples:
                valid:
                  value:
                    valid: true
                    cart:
                      id: "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
                      items:
                        - id: "bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb"
                          product_id: "11111111-1111-4111-8111-111111111111"
                          sku: "ROTOR-BRG-6205"
                          name: "Rodamiento industrial"
                          quantity: 2
                          unit_price: "45000.00"
                          tax_amount: "17100.00"
                          line_total: "107100.00"
                          available_quantity: 24
                          reservation_expires_at: "2026-09-18T16:30:00Z"
                      subtotal: "90000.00"
                      tax_total: "17100.00"
                      total: "107100.00"
                      currency: "COP"
                      expires_at: "2026-09-18T16:30:00Z"
                    validation_errors: []
                    totals:
                      subtotal: "90000.00"
                      tax_total: "17100.00"
                      total: "107100.00"
                      currency: "COP"
                noActiveCart:
                  value:
                    valid: false
                    cart: null
                    validation_errors:
                      - code: CART_EMPTY
                        message: Cart has no items.
                    totals:
                      subtotal: "0.00"
                      tax_total: "0.00"
                      total: "0.00"
                      currency: "COP"
                emptyActiveCart:
                  value:
                    valid: false
                    cart:
                      id: "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
                      items: []
                      subtotal: "0.00"
                      tax_total: "0.00"
                      total: "0.00"
                      currency: "COP"
                      expires_at: null
                    validation_errors:
                      - code: CART_EMPTY
                        message: Cart has no items.
                    totals:
                      subtotal: "0.00"
                      tax_total: "0.00"
                      total: "0.00"
                      currency: "COP"
                reservationExpired:
                  value:
                    valid: false
                    cart:
                      id: "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
                      items:
                        - id: "bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb"
                          product_id: "11111111-1111-4111-8111-111111111111"
                          sku: "ROTOR-BRG-6205"
                          name: "Rodamiento industrial"
                          quantity: 1
                          unit_price: "45000.00"
                          tax_amount: "8550.00"
                          line_total: "53550.00"
                          available_quantity: 24
                          reservation_expires_at: null
                      subtotal: "45000.00"
                      tax_total: "8550.00"
                      total: "53550.00"
                      currency: "COP"
                      expires_at: null
                    validation_errors:
                      - code: RESERVATION_EXPIRED
                        message: One or more reservations have expired.
                    totals:
                      subtotal: "45000.00"
                      tax_total: "8550.00"
                      total: "53550.00"
                      currency: "COP"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: |
            Authenticated CUSTOMER without a linked customer profile
            (`CUSTOMER_PROFILE_REQUIRED`).

            `PRICE_CHANGED` is reserved for a future price-negotiation flow and
            is not emitted by the E3 MVP checkout validate path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                customerProfileRequired:
                  value:
                    code: CUSTOMER_PROFILE_REQUIRED
                    message: A customer profile is required to use checkout.
                    details: {}
                    trace_id: "trace-synth-0409d"
        "422":
          description: |
            Request field validation failed (`VALIDATION_ERROR`).
            Business preflight failures for this operation use HTTP 200 with
            `valid: false` and `validation_errors` instead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                invalidCustomer:
                  value:
                    code: VALIDATION_ERROR
                    message: The given data was invalid.
                    details:
                      errors:
                        customer.email: ["The customer.email field must be a valid email address."]
                    trace_id: "trace-synth-0010"
                missingDeliveryAddress:
                  value:
                    code: VALIDATION_ERROR
                    message: The given data was invalid.
                    details:
                      errors:
                        delivery.address: ["is required for coordinated shipping"]
                    trace_id: "trace-synth-0015"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/orders:
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Create order from validated cart
      description: |
        Creates an order from the authenticated CUSTOMER's ACTIVE cart.

        Successful responses use HTTP 201 with `status: PENDING_PAYMENT`
        (including idempotent replays of the same key + same payload).

        Requires header `Idempotency-Key`. Same key + same CheckoutRequest
        fingerprint returns the original order without requiring an ACTIVE cart
        (the first success converts the cart). Same key + different payload, or
        the same key owned by another customer, yields `IDEMPOTENCY_CONFLICT`
        (HTTP 409).

        On success, within one transaction:
        - Order + OrderItem commercial snapshots are persisted (server catalog
          prices at creation time; client cannot supply prices);
        - ACTIVE stock reservations are linked via `order_id` and remain
          `ACTIVE` until payment outcome (CONSUMED) or cancel/expiry (RELEASED);
        - cart status becomes `CONVERTED` (history retained).

        `products.stock_quantity` is not decremented at order creation.
        `PRICE_CHANGED` is not emitted in this MVP (no client expected price).
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
            examples:
              create:
                value:
                  customer:
                    name: "Cliente Demo Rotor"
                    email: "cliente.demo@example.test"
                    phone: "+570000000000"
                    document_type: "CC"
                    document_number: "1000000000"
                  delivery:
                    mode: COORDINATED_SHIPPING
                    address: "Calle Demo 12 # 34-56, Ciudad Rotor"
      responses:
        "201":
          description: |
            Order created as `PENDING_PAYMENT`, or an idempotent replay of the
            same `Idempotency-Key` + same payload returning the original order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
              examples:
                created:
                  $ref: "#/components/examples/OrderPendingPayment"
        "400":
          description: Malformed body or missing/invalid `Idempotency-Key` header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                missingIdempotencyKey:
                  value:
                    code: MALFORMED_REQUEST
                    message: Idempotency-Key header is required and must be 8-128 characters.
                    details:
                      header: Idempotency-Key
                    trace_id: "trace-synth-0400b"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: |
            Resource/state conflict:
            `IDEMPOTENCY_CONFLICT` or `CUSTOMER_PROFILE_REQUIRED`.

            `PRICE_CHANGED` remains a reserved ErrorCode for future flows and is
            not emitted by E3 MVP order creation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                idempotencyConflict:
                  value:
                    code: IDEMPOTENCY_CONFLICT
                    message: Idempotency-Key was reused with a different payload.
                    details:
                      reason: payload_mismatch
                    trace_id: "trace-synth-0002"
                customerProfileRequired:
                  value:
                    code: CUSTOMER_PROFILE_REQUIRED
                    message: A customer profile is required to use the cart.
                    details: {}
                    trace_id: "trace-synth-0409e"
        "422":
          description: |
            Validation or commerce constraint failed:
            `VALIDATION_ERROR`, `CART_EMPTY`, `INSUFFICIENT_STOCK`,
            `RESERVATION_EXPIRED`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                cartEmpty:
                  value:
                    code: CART_EMPTY
                    message: Cart has no items.
                    details: {}
                    trace_id: "trace-synth-0011"
                missingDeliveryAddress:
                  value:
                    code: VALIDATION_ERROR
                    message: The given data was invalid.
                    details:
                      errors:
                        delivery.address: ["is required for coordinated shipping"]
                    trace_id: "trace-synth-0016"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/orders/{orderId}:
    get:
      tags: [Orders]
      operationId: getOrder
