      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: ["integer", "null"]
        name:
          type: string
          maxLength: 160
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 30
        document_type:
          type: string
          maxLength: 10
        document_number:
          type: string
          maxLength: 30
        created_at:
          type: ["string", "null"]
          format: date-time
        updated_at:
          type: ["string", "null"]
          format: date-time

    CustomerWriteRequest:
      type: object
      additionalProperties: false
      properties:
        user_id:
          type: ["integer", "null"]
        name:
          type: string
          maxLength: 160
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 30
        document_type:
          type: string
          maxLength: 10
        document_number:
          type: string
          maxLength: 30

    CustomerEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/Customer"

    CustomerListResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Customer"

    User:
      type: object
      required: [id, name, email, role]
      additionalProperties: false
      description: User response never includes password or remember_token.
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [ADMIN, CUSTOMER]
        created_at:
          type: ["string", "null"]
          format: date-time
        updated_at:
          type: ["string", "null"]
          format: date-time

    UserCreateRequest:
      type: object
      required: [name, email, password, role]
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          writeOnly: true
        role:
          type: string
          enum: [ADMIN, CUSTOMER]

    UserUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          writeOnly: true
        role:
          type: string
          enum: [ADMIN, CUSTOMER]

    UserEnvelope:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/User"

    UserListResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"

    ProductSummary:
      type: object
      required:
        - id
        - sku
        - name
        - unit_price
        - currency
        - available_quantity
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
          description: Synthetic catalog SKU (not production data).
          examples:
            - "ROTOR-BRG-6205"
        name:
          type: string
          examples:
            - "Rodamiento industrial"
        unit_price:
          $ref: "#/components/schemas/MoneyAmount"
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        available_quantity:
          type: integer
          minimum: 0
          description: |
            Sellable units. Conceptually
            `available_quantity = quantity - reserved_quantity`.
        tax_rate:
          type: string
          description: Optional tax rate as decimal string (e.g. 0.1900 = 19%).
          pattern: "^[0-9]+(\\.[0-9]{1,4})?$"
          examples:
            - "0.1900"

    ProductListResponse:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProductSummary"
        meta:
          type: object
          required: [page, per_page, total]
          additionalProperties: false
          properties:
            page:
              type: integer
              minimum: 1
            per_page:
              type: integer
              minimum: 1
            total:
              type: integer
              minimum: 0

    CartItem:
      type: object
      required:
        - id
        - product_id
        - sku
        - name
        - quantity
        - unit_price
        - tax_amount
        - line_total
        - available_quantity
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
        quantity:
          type: integer
          minimum: 1
        unit_price:
          $ref: "#/components/schemas/MoneyAmount"
        tax_amount:
          $ref: "#/components/schemas/MoneyAmount"
        line_total:
          $ref: "#/components/schemas/MoneyAmount"
          description: Line total including tax for this item.
        available_quantity:
          type: integer
          minimum: 0
          description: |
            Maximum quantity currently reachable for this line:
            product stock minus ACTIVE non-expired reservations belonging to
            OTHER cart lines. The line's own ACTIVE reservation is not
            subtracted twice.
        reservation_expires_at:
          type: ["string", "null"]
          format: date-time
          description: Expiration of the temporary stock reservation for this line.

    Cart:
      type: object
      required:
        - id
        - items
        - subtotal
        - tax_total
        - total
        - currency
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        subtotal:
          $ref: "#/components/schemas/MoneyAmount"
        tax_total:
          $ref: "#/components/schemas/MoneyAmount"
        total:
          $ref: "#/components/schemas/MoneyAmount"
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        expires_at:
          type: ["string", "null"]
          format: date-time
          description: Cart/reservation window expiry when applicable.

    AddCartItemRequest:
      type: object
      required: [product_id, quantity]
      additionalProperties: false
      properties:
        product_id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1

    UpdateCartItemRequest:
      type: object
      required: [quantity]
      additionalProperties: false
      properties:
        quantity:
          type: integer
          minimum: 1

    CustomerData:
      type: object
      required:
        - name
        - email
        - phone
        - document_type
        - document_number
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
          examples:
            - "Cliente Demo Rotor"
        email:
          type: string
          format: email
          examples:
            - "cliente.demo@example.test"
        phone:
          type: string
          examples:
            - "+570000000000"
        document_type:
          type: string
          description: Identification document type code (synthetic).
          examples:
            - "CC"
        document_number:
          type: string
          examples:
            - "1000000000"

    DeliveryData:
      type: object
      required: [mode]
      additionalProperties: false
      description: |
        Delivery modality and, for coordinated shipping, the delivery address.
        The address is stored as a snapshot of the order. Rules:
        COORDINATED_SHIPPING → `address` is required and must not be blank;
        PICKUP → `address` is not needed and must be omitted or null.
      properties:
        mode:
          type: string
          description: Delivery modality. No carrier/logistics modeling in this contract.
          enum:
            - PICKUP
            - COORDINATED_SHIPPING
        address:
          type: ["string", "null"]
          minLength: 5
          maxLength: 255
          pattern: "\\S"
          description: |
            Delivery address for coordinated shipping (synthetic in examples).
            Required when `mode` is COORDINATED_SHIPPING; omitted or null for PICKUP.
          examples:
            - "Calle Demo 12 # 34-56, Ciudad Rotor"
      if:
        required: [mode]
        properties:
          mode:
            const: COORDINATED_SHIPPING
      then:
        required: [address]
        properties:
          mode:
            const: COORDINATED_SHIPPING
          address:
            type: string
      else:
        properties:
          mode:
            const: PICKUP
          address:
            type: "null"

    CheckoutRequest:
      type: object
      required: [customer, delivery]
      additionalProperties: false
      properties:
        customer:
          $ref: "#/components/schemas/CustomerData"
        delivery:
          $ref: "#/components/schemas/DeliveryData"

    CheckoutTotals:
      type: object
      required: [subtotal, tax_total, total, currency]
      additionalProperties: false
      properties:
        subtotal:
          $ref: "#/components/schemas/MoneyAmount"
        tax_total:
          $ref: "#/components/schemas/MoneyAmount"
        total:
          $ref: "#/components/schemas/MoneyAmount"
        currency:
          $ref: "#/components/schemas/CurrencyCode"

    ValidationIssue:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string

    CheckoutValidation:
      type: object
      required: [valid, cart, validation_errors, totals]
      additionalProperties: false
      properties:
        valid:
          type: boolean
        cart:
          description: |
            ACTIVE cart representation when one exists (including empty carts).
            `null` when the customer has no ACTIVE cart (checkout does not create one).
          oneOf:
            - $ref: "#/components/schemas/Cart"
            - type: "null"
        validation_errors:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
        totals:
          $ref: "#/components/schemas/CheckoutTotals"

    OrderItem:
      type: object
      required:
        - id
        - product_id
        - sku
        - product_name
        - quantity
        - unit_price
        - tax_amount
        - line_total
      additionalProperties: false
      description: |
        Immutable commercial snapshot taken at order creation time.
        Later catalog price changes must not alter these fields.
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        sku:
          type: string
        product_name:
          type: string
        quantity:
          type: integer
          minimum: 1
        unit_price:
          $ref: "#/components/schemas/MoneyAmount"
        tax_amount:
          $ref: "#/components/schemas/MoneyAmount"
        line_total:
          $ref: "#/components/schemas/MoneyAmount"

    Order:
      type: object
      required:
        - id
        - order_number
        - status
        - currency
        - subtotal
        - tax_total
        - total
        - customer
        - delivery
        - items
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        order_number:
          type: string
          description: Human-readable order number (synthetic format).
          examples:
            - "RTR-20260918-0001"
        status:
          $ref: "#/components/schemas/OrderStatus"
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        subtotal:
          $ref: "#/components/schemas/MoneyAmount"
        tax_total:
          $ref: "#/components/schemas/MoneyAmount"
        total:
          $ref: "#/components/schemas/MoneyAmount"
        customer:
          $ref: "#/components/schemas/CustomerData"
        delivery:
          $ref: "#/components/schemas/DeliveryData"
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItem"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OrderStatusResponse:
      type: object
      required: [order_id, status, updated_at]
      additionalProperties: false
      properties:
        order_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/OrderStatus"
        updated_at:
          type: string
          format: date-time
